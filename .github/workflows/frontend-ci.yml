name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "application/frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "application/frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  build:
    name: Frontend Build & Type Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application/frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: application/frontend/package.json

      - name: Install dependencies
        run: npm ci

      - name: Compile & Build with Vite
        run: npm run build
