name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "application/backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "application/backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    name: Backend Lint, Type-Check & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application/backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: deploystack
          POSTGRES_PASSWORD: deploystack_password
          POSTGRES_DB: deploystack_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start MinIO Storage Service
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin cgr.dev/chainguard/minio:latest server /data

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: ruff check .

      - name: Type check with Mypy
        run: mypy app/

      - name: Run Pytest test suite
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: deploystack
          POSTGRES_PASSWORD: deploystack_password
          POSTGRES_DB: deploystack_db
          DATABASE_URL: postgresql://deploystack:deploystack_password@localhost:5432/deploystack_db
          S3_ENDPOINT_URL: http://localhost:9000
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_DEFAULT_REGION: us-east-1
          S3_BUCKET_NAME: deploystack-attachments
        run: |
          alembic upgrade head
          pytest -v
