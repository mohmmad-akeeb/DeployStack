services:
  backend:
    build:
      context: ./application/backend
      dockerfile: Dockerfile
    container_name: deploystack-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=DeployStack
      - ENVIRONMENT=development
      - DEBUG=true
      - SECRET_KEY=insecure-dev-secret-key-change-in-production-min-32-chars
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=deploystack
      - POSTGRES_PASSWORD=deploystack_password
      - POSTGRES_DB=deploystack_db
      - DATABASE_URL=postgresql://deploystack:deploystack_password@postgres:5432/deploystack_db
      - S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_DEFAULT_REGION=us-east-1
      - S3_BUCKET_NAME=deploystack-attachments
      - BACKEND_CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000","http://localhost:5173"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - deploystack-net

  frontend:
    build:
      context: ./application/frontend
      dockerfile: Dockerfile
    container_name: deploystack-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - deploystack-net

  postgres:
    image: postgres:16-alpine
    container_name: deploystack-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=deploystack
      - POSTGRES_PASSWORD=deploystack_password
      - POSTGRES_DB=deploystack_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deploystack -d deploystack_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - deploystack-net

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: deploystack-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - deploystack-net

  minio-init:
    image: cgr.dev/chainguard/minio:latest
    container_name: deploystack-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set localminio http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing localminio/deploystack-attachments &&
        echo 'MinIO bucket initialized successfully';
        exit 0;
    networks:
      - deploystack-net

networks:
  deploystack-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
